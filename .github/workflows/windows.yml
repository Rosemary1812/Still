name: Windows client

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: app
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      RUST_MIN_STACK: '268435456'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Update stable Rust
        run: rustup update stable --no-self-update
      - name: Build pinned NSH
        working-directory: toolchain/nsh
        run: |
          cargo build --locked -p nsh-cli
          if ($LASTEXITCODE -ne 0) { throw 'NSH build failed' }
          Join-Path (Get-Location) 'target/debug' | Out-File -Append $env:GITHUB_PATH
      - name: Test native library
        run: cargo test --locked --manifest-path native/Cargo.toml
      - name: Check NSH interface
        run: nsh check App.tsx
      - name: Test import and playback with picker fixtures
        run: |
          $env:STILL_LIBRARY_DIR = Join-Path $env:RUNNER_TEMP 'still-headless-test'
          nsh test App.test.tsx
      - name: Test the client in Win32 windows
        run: |
          $env:STILL_LIBRARY_DIR = Join-Path $env:RUNNER_TEMP 'still-ui-test'
          nsh test Windows.test.tsx --target windows
      - name: Package Windows client
        run: nsh package App.tsx --target windows
      - uses: actions/upload-artifact@v4
        with:
          name: Still-Windows-x64
          path: app/.nsh/out/*.zip
          include-hidden-files: true
          if-no-files-found: error
