[package]
name = "contactsheet-native"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = { path = "../../toolchain/nsh/crates/nsh-core" }
rusqlite = { version = "0.37", features = ["bundled"] }
fastrand = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
serde_json = "1"
imagesize = "0.15"
