<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>相册 · 照片墙与双页阅读</title></head><body>
<div id="cs-flow" aria-label="多相册与阅读流程原型">
<div class="cs-window">
<header class="cs-toolbar"><button id="cs-back" hidden>‹ 全部相册</button><span id="cs-brand">相册</span><div id="cs-modes" hidden><button data-mode="overview" aria-pressed="true">预览</button><button data-mode="book" aria-pressed="false">双页相册</button></div><button id="cs-new">＋ 新建相册</button></header>
<main id="cs-content"></main>
<footer><span id="cs-status" aria-live="polite"></span><span>摄影样片 · 示例文字</span></footer>
</div>
</div>
<style>
#cs-flow{color-scheme:light dark;font:14px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--ink:light-dark(#292923,#f0ece2);--paper:light-dark(#faf8f2,#24241f);--muted:light-dark(#77766d,#b9b6ac);--line:light-dark(#dedbd2,#47473e);color:var(--ink)}
#cs-flow *{box-sizing:border-box}
#cs-flow .cs-window{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#cs-flow button,#cs-flow input,#cs-flow textarea{font:inherit;color:inherit}
#cs-flow button{cursor:default;border:1px solid var(--line);background:var(--paper);padding:7px 13px;border-radius:8px;transition:background .15s,transform .2s}
#cs-flow button:hover{background:light-dark(#ece9df,#38382e)}
#cs-flow button:focus-visible{outline:3px solid #b28a4d;outline-offset:3px}
#cs-flow button:disabled{opacity:.35}
#cs-flow .cs-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 22px;min-height:68px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#cs-flow #cs-brand{font:500 17px Georgia,serif;letter-spacing:-.03em}
#cs-flow #cs-modes{display:flex;gap:3px;padding:3px;background:light-dark(#eae7de,#141511);border-radius:10px}
#cs-flow #cs-modes button{border:0;background:transparent;color:var(--muted)}
#cs-flow #cs-modes button[aria-pressed=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px #0002}
#cs-flow .cs-heading{padding:30px 32px 24px;display:flex;justify-content:space-between;align-items:end;gap:20px}
#cs-flow h1{font:400 29px/1.3 Georgia,'Songti SC',serif;margin:0 0 7px}
#cs-flow h2{font:400 26px/1.4 Georgia,'Songti SC',serif;margin:8px 0 20px}
#cs-flow p{margin:0}
#cs-flow .cs-small{font-size:12px;color:var(--muted)}

#cs-flow .cs-album{border:0;padding:0;text-align:left;background:transparent;border-radius:0;min-width:0}
#cs-flow .cs-album:hover{background:transparent;transform:translateY(-4px)}
#cs-flow .cs-cover{aspect-ratio:1.12;position:relative;margin:0 5px 14px 0;isolation:isolate}

#cs-flow .cs-cover:after{inset:2px -2px -2px 2px;background:var(--paper)}
#cs-flow .cs-cover img{width:100%;height:100%;object-fit:cover;border-radius:4px;box-shadow:0 6px 12px #0002}
#cs-flow .cs-album-title{font-size:15px;display:block;margin-bottom:2px}
#cs-flow .cs-wall-wrap{background:light-dark(#d7d5cd,#151614);padding:12px;overflow:hidden}
#cs-flow .cs-wall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#cs-flow .cs-photo{padding:0;border:0;border-radius:2px;aspect-ratio:1;overflow:hidden;background:#333;box-shadow:0 3px 9px #0003;position:relative}
#cs-flow .cs-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
#cs-flow .cs-photo:hover{transform:translateY(-3px);z-index:1;box-shadow:0 7px 18px #0005}
#cs-flow .cs-photo:hover img{transform:scale(1.04)}
#cs-flow .cs-detailbar{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;gap:14px;flex-wrap:wrap}

#cs-flow .cs-text{white-space:pre-wrap;font:16px/1.95 Georgia,'Songti SC',serif;overflow-wrap:anywhere}
#cs-flow .cs-notefoot{margin-top:28px;font-size:11px;letter-spacing:.12em;color:var(--muted)}
#cs-flow .cs-pages{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;border-top:1px solid var(--line);gap:10px;flex-wrap:wrap}
#cs-flow .cs-film{display:flex;gap:7px;flex-wrap:wrap;padding:16px 28px;background:light-dark(#efede5,#1a1b17)}
#cs-flow .cs-film button{padding:0;width:52px;height:52px;border:2px solid transparent;overflow:hidden;border-radius:3px;opacity:.55}
#cs-flow .cs-film button[aria-pressed=true]{border-color:#b28a4d;opacity:1}
#cs-flow .cs-film img{width:100%;height:100%;object-fit:cover}

#cs-flow .cs-editor label{font-size:12px;color:var(--muted);display:grid;gap:5px}
#cs-flow input,#cs-flow textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
#cs-flow .cs-editor-actions{display:flex;gap:8px}
#cs-flow .cs-newform{max-width:480px;padding:32px;margin:auto;min-height:400px}
#cs-flow footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 22px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
#cs-flow [hidden]{display:none!important}
@media(max-width:650px){#cs-flow .cs-library{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 18px 24px;gap:24px 15px}#cs-flow .cs-heading{padding:25px 20px}#cs-flow .cs-wall{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}#cs-flow .cs-spread{grid-template-columns:1fr;gap:25px;padding:20px}#cs-flow .cs-spread>img{height:280px}#cs-flow .cs-toolbar{padding:12px}#cs-flow h1{font-size:25px}}
@media(prefers-reduced-motion:reduce){#cs-flow button,#cs-flow img{transition:none!important}}
</style>

<style>
html,body{margin:0;padding:0;background:#faf8f2;color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,sans-serif}

</style><script>
(()=>{const r=document.getElementById('cs-flow'),q=s=>r.querySelector(s),main=q('#cs-content');const src=i=>'assets/photo-'+(((i%16)+16)%16)+'.jpg';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let albums=seeds.slice(0,3).map((s,a)=>({title:s[0],date:s[1],intro:s[2],cover:a,photos:Array.from({length:16},(_,i)=>({image:(i+a)%16,title:['把这一天夹进相册','停下来，多看一会儿','没有写进计划的片刻','留给以后的我们'][i%4],meta:s[1]+' · 第 '+(i+1)+' 个片刻',text:captions[i%4]}))}));let album=null,mode='overview',selected=null,creating=false;
try{const saved=JSON.parse(localStorage.getItem('contact-sheet-photo-albums')||'null');if(Array.isArray(saved)&&saved.length&&saved.every(a=>typeof a.title==='string'&&Array.isArray(a.photos)&&a.photos.length===16))albums=saved}catch{}

let stopMotion=()=>{};const wallPositions=new Map();let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(){stopMotion();stopMotion=()=>{};q('.cs-window').classList.toggle('is-book',album!==null&&mode==='book'&&!creating);q('.cs-window').classList.toggle('is-wall',album!==null&&mode==='overview'&&selected===null&&!creating);q('#cs-back').hidden=album===null&&!creating;q('#cs-brand').hidden=album!==null||creating;q('#cs-modes').hidden=album===null||creating;q('#cs-new').hidden=album!==null||creating;q('#cs-status').textContent=album===null?'我的相册 · '+albums.length+' 本':albums[album].title+' / '+(mode==='book'?'双页阅读':selected===null?'照片预览':'单张预览');
q('#cs-modes').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));

const a=albums[album];if(mode==='overview'&&selected===null){

const wallAlbum=album,wrap=q('.cs-wall-wrap'),rows=[...main.querySelectorAll('.cs-wall-row')];let drag=null,moved=false,hover=false,focusWithin=false,shifts=wallPositions.get(album)||[0,0,0,0],frame=0,last=0;

wrap.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hover=true});wrap.addEventListener('focusin',e=>{focusWithin=e.target.matches(':focus-visible')});wrap.addEventListener('focusout',e=>{focusWithin=wrap.contains(e.relatedTarget)});

q('#cs-motion').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'继续流动':'暂停流动';e.currentTarget.setAttribute('aria-pressed',paused)};
q('#cs-start').onclick=()=>{selected=0;mode='book';draw();save()};return}
if(selected===null)selected=0;const p=a.photos[selected];main.innerHTML=`<div class="cs-detailbar"><button id="cs-grid">‹ 照片预览</button><span class="cs-small">${esc(a.title)} · ${selected+1} / ${a.photos.length}</span>${mode==='overview'?'<button id="cs-read">用双页相册阅读 →</button>':'<span class="cs-small">'+esc(a.date)+'</span>'}</div><div class="cs-spread">${img(p)}<article><div class="cs-small">${esc(p.meta)}</div><h2>${esc(p.title)}</h2><p class="cs-text">${esc(p.text)||'为这张照片写下第一段回忆。'}</p><div class="cs-notefoot">${String(selected+1).padStart(2,'0')} / ${esc(a.title)}</div><button id="cs-edit" style="margin-top:20px">编辑描述</button><form class="cs-editor" hidden><label>照片标题<input name="title" value="${esc(p.title)}"></label><label>照片描述<textarea name="text" rows="5">${esc(p.text)}</textarea></label><div class="cs-editor-actions"><button type="submit">保存</button><button type="button" id="cs-cancel">取消</button></div></form></article></div>${mode==='overview'?`<div class="cs-film">${a.photos.map((x,i)=>`<button data-photo="${i}" aria-label="第 ${i+1} 张" aria-pressed="${i===selected}">${img(x)}</button>`).join('')}</div>`:''}<div class="cs-pages"><button id="cs-prev" ${selected===0?'disabled':''}>← 上一${mode==='book'?'页':'张'}</button><span class="cs-small">${selected+1} / ${a.photos.length}</span><button id="cs-next" ${selected===a.photos.length-1?'disabled':''}>下一${mode==='book'?'页':'张'} →</button></div>`;
q('#cs-grid').onclick=()=>{selected=null;mode='overview';draw();save()};if(q('#cs-read'))q('#cs-read').onclick=()=>{mode='book';draw();save()};q('#cs-prev').onclick=()=>step(-1);q('#cs-next').onclick=()=>step(1);main.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{selected=+b.dataset.photo;draw();save()});const form=main.querySelector('form');q('#cs-edit').onclick=()=>{form.hidden=false;q('#cs-edit').hidden=true;form.elements.text.focus()};q('#cs-cancel').onclick=()=>draw();form.onsubmit=e=>{e.preventDefault();p.title=form.elements.title.value;p.text=form.elements.text.value;save();draw()};}
function step(d){if(album===null||selected===null)return;selected=Math.max(0,Math.min(albums[album].photos.length-1,selected+d));draw();save()}
q('#cs-back').onclick=()=>{album=null;creating=false;selected=null;draw();save()};q('#cs-new').onclick=()=>{creating=true;draw()};q('#cs-modes').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;if(mode==='book'&&selected===null)selected=0;else if(mode==='overview')selected=null;draw();save()});r.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}if(e.key==='Escape'&&album!==null){if(selected===null&&mode==='overview')album=null;selected=null;mode='overview';draw();save()}});draw();
})();
</script>

</body></html>
